name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "LanBox/**"
      - "project.yml"
      - ".github/workflows/ios.yml"

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -project LanBox.xcodeproj \
            -scheme LanBox \
            -destination 'generic/platform=iOS' \
            -resolvePackageDependencies

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project LanBox.xcodeproj \
            -scheme LanBox \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | tail -n 60

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/LanBox.app"
          test -d "$APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry ../LanBox-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LanBox-unsigned-ipa
          path: LanBox-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
